<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krick's Weather · 城市景色</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1f252b;
    --muted: rgba(31, 37, 43, 0.62);
    --paper: rgba(255, 255, 255, 0.76);
    --paper-strong: rgba(255, 255, 255, 0.9);
    --line: rgba(255, 255, 255, 0.45);
    --shadow: 0 24px 72px rgba(31, 37, 43, 0.20);
    --accent: #ff6f61;
    --accent-2: #51b6a8;
  }

  body {
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #e9eff1;
    overflow-x: hidden;
  }

  .scene,
  .scene::before,
  .scene::after {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .scene { z-index: -4; background: linear-gradient(145deg, #e8eef0 0%, #f9ede6 50%, #d9edf0 100%); }
  .scene::before {
    content: "";
    z-index: -3;
    background-image: var(--place-image);
    background-size: cover;
    background-position: center;
    opacity: var(--image-opacity, 0);
    transform: scale(1.02);
    transition: opacity 900ms ease, transform 1200ms ease;
  }
  .scene::after {
    content: "";
    z-index: -2;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.18) 42%, rgba(255,255,255,0.74) 100%),
      radial-gradient(circle at 12% 12%, rgba(255,111,97,0.22), transparent 34%),
      radial-gradient(circle at 88% 18%, rgba(81,182,168,0.20), transparent 30%);
    backdrop-filter: blur(2px) saturate(1.05);
  }

  .shell {
    width: min(1180px, calc(100% - 28px));
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 0 38px;
    display: grid;
    gap: 24px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #ffc3a0 48%, var(--accent-2));
    box-shadow: 0 10px 28px rgba(255,111,97,0.25);
    flex: 0 0 auto;
  }

  .brand h1 {
    font-size: clamp(20px, 3vw, 32px);
    line-height: 1.05;
    font-weight: 780;
    letter-spacing: 0;
  }

  .brand p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  .time-pill {
    padding: 10px 15px;
    border-radius: 999px;
    background: rgba(255,255,255,0.50);
    border: 1px solid rgba(255,255,255,0.60);
    backdrop-filter: blur(20px);
    color: rgba(31,37,43,0.70);
    font-size: 13px;
    white-space: nowrap;
  }

  .back-btn {
    display: none;
    align-items: center;
    gap: 8px;
    border: 0;
    background: rgba(255,255,255,0.60);
    border: 1px solid rgba(255,255,255,0.56);
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 14px;
    cursor: pointer;
    backdrop-filter: blur(18px);
    box-shadow: 0 10px 30px rgba(31,37,43,0.08);
  }

  .back-btn.visible { display: inline-flex; }

  .view { display: none; }
  .view.active { display: block; }

  .search-view {
    align-self: center;
    display: grid;
    place-items: center;
    min-height: calc(100vh - 120px);
  }

  .search-hero {
    width: min(860px, 100%);
    padding: clamp(26px, 5vw, 48px);
    border-radius: 34px;
    background: linear-gradient(145deg, rgba(255,255,255,0.78), rgba(255,255,255,0.48));
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    backdrop-filter: blur(28px) saturate(1.18);
  }

  .eyebrow {
    color: rgba(31,37,43,0.54);
    font-size: 12px;
    font-weight: 720;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hero-title {
    max-width: 720px;
    margin-top: 14px;
    font-size: clamp(42px, 7vw, 86px);
    line-height: 0.92;
    letter-spacing: 0;
    font-weight: 820;
  }
  .hero-title span { color: var(--accent); }

  .hero-copy {
    max-width: 640px;
    margin: 22px 0 28px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.75;
  }

  .search-wrap { position: relative; max-width: 720px; }

  .search-box {
    display: grid;
    grid-template-columns: 42px 1fr auto auto;
    align-items: center;
    gap: 0;
    min-height: 66px;
    padding: 7px 8px 7px 14px;
    border-radius: 24px;
    background:
      linear-gradient(var(--paper-strong), var(--paper-strong)) padding-box,
      linear-gradient(120deg, rgba(255,111,97,0.80), rgba(81,182,168,0.72), rgba(255,255,255,0.64)) border-box;
    border: 1px solid transparent;
    box-shadow: 0 18px 46px rgba(31,37,43,0.14);
    transition: transform 220ms ease, box-shadow 220ms ease;
  }
  .search-box:focus-within {
    transform: translateY(-2px);
    box-shadow: 0 26px 64px rgba(31,37,43,0.18);
  }

  .search-icon {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 15px;
    background: rgba(81,182,168,0.12);
    color: #2f8f84;
    flex: 0 0 auto;
  }

  .search-input {
    min-width: 0;
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    padding: 0 12px;
  }
  .search-input::placeholder { color: rgba(31,37,43,0.38); }

  .icon-btn,
  .primary-btn,
  .mini-btn,
  .suggestion {
    border: 0;
    cursor: pointer;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 16px;
    background: rgba(31,37,43,0.06);
    color: rgba(31,37,43,0.64);
    font-size: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease, background 180ms ease;
  }
  .icon-btn.visible { opacity: 1; pointer-events: auto; }
  .icon-btn:hover,
  .primary-btn:hover,
  .mini-btn:hover { transform: translateY(-1px); }

  .primary-btn {
    height: 50px;
    padding: 0 20px;
    border-radius: 18px;
    background: #1f252b;
    color: #fff;
    font-weight: 720;
    font-size: 14px;
    white-space: nowrap;
    transition: transform 180ms ease, opacity 180ms ease;
  }

  .suggestions {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    right: 0;
    z-index: 30;
    display: none;
    max-height: 340px;
    overflow: auto;
    border-radius: 22px;
    background: rgba(255,255,255,0.90);
    border: 1px solid rgba(255,255,255,0.64);
    box-shadow: 0 24px 72px rgba(31,37,43,0.18);
    backdrop-filter: blur(26px);
  }
  .suggestions.show { display: block; }

  .suggestion {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: transparent;
    color: var(--ink);
    text-align: left;
    border-bottom: 1px solid rgba(31,37,43,0.06);
  }
  .suggestion:hover,
  .suggestion.active { background: rgba(81,182,168,0.12); }
  .suggestion strong { display: block; font-size: 15px; }
  .suggestion span { display: block; margin-top: 3px; color: rgba(31,37,43,0.48); font-size: 12px; }
  .suggestion small { color: rgba(31,37,43,0.42); white-space: nowrap; }

  .quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }

  .mini-btn {
    border-radius: 999px;
    padding: 9px 14px;
    background: rgba(255,255,255,0.48);
    border: 1px solid rgba(31,37,43,0.08);
    color: rgba(31,37,43,0.68);
    backdrop-filter: blur(18px);
  }

  .detail-view { padding-bottom: 10px; }

  .detail-shell {
    display: grid;
    gap: 18px;
  }

  .detail-hero {
    position: relative;
    min-height: 420px;
    border-radius: 34px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.36) 100%),
      rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.28);
    box-shadow: var(--shadow);
  }

  .detail-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    opacity: var(--hero-opacity, 0);
    transform: scale(1.02);
    transition: opacity 900ms ease;
  }

  .detail-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(20,24,26,0.08) 0%, rgba(20,24,26,0.24) 35%, rgba(20,24,26,0.68) 100%);
  }

  .detail-hero-content {
    position: absolute;
    inset: auto 0 0 0;
    z-index: 1;
    padding: 28px;
    color: #fff;
  }

  .place-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .place-title {
    font-size: clamp(32px, 6vw, 68px);
    line-height: 0.95;
    font-weight: 820;
    letter-spacing: 0;
  }

  .place-tag,
  .place-note {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.20);
    backdrop-filter: blur(14px);
    color: rgba(255,255,255,0.92);
    font-size: 12px;
    white-space: nowrap;
  }

  .place-copy {
    max-width: 720px;
    margin-top: 12px;
    color: rgba(255,255,255,0.82);
    line-height: 1.75;
    font-size: 15px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.6fr);
    gap: 18px;
  }

  .panel {
    border-radius: 28px;
    background: rgba(255,255,255,0.66);
    border: 1px solid rgba(255,255,255,0.44);
    box-shadow: 0 18px 48px rgba(31,37,43,0.10);
    backdrop-filter: blur(28px) saturate(1.12);
  }

  .weather-panel {
    padding: 24px;
    display: grid;
    gap: 18px;
  }

  .weather-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 18px;
  }

  .location-name {
    font-size: 28px;
    line-height: 1.08;
    font-weight: 780;
  }

  .location-meta {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .weather-badge {
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(81,182,168,0.14);
    color: #24796f;
    font-size: 12px;
    font-weight: 720;
    white-space: nowrap;
  }

  .temperature {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-top: 12px;
  }

  .weather-symbol {
    font-size: clamp(50px, 7vw, 76px);
    line-height: 1;
  }

  .temperature strong {
    font-size: clamp(88px, 12vw, 132px);
    line-height: 0.82;
    letter-spacing: 0;
    font-weight: 820;
  }

  .temperature sup {
    margin-top: 10px;
    color: rgba(31,37,43,0.48);
    font-size: 28px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .metric,
  .story-block,
  .forecast-card {
    border-radius: 20px;
    background: rgba(255,255,255,0.58);
    border: 1px solid rgba(255,255,255,0.44);
    padding: 15px;
  }

  .metric span,
  .story-block span,
  .forecast-card .day {
    color: rgba(31,37,43,0.50);
    font-size: 12px;
  }

  .metric strong,
  .story-block strong {
    display: block;
    margin-top: 8px;
    font-size: 18px;
  }

  .story-panel {
    padding: 24px;
    display: grid;
    gap: 16px;
  }

  .story-title {
    font-size: 14px;
    color: rgba(31,37,43,0.55);
    font-weight: 720;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .story-note {
    color: var(--ink);
    line-height: 1.7;
  }

  .forecast-list {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
  }

  .forecast-card {
    text-align: center;
    min-width: 0;
    padding: 12px 10px;
  }
  .forecast-card .icon { margin: 8px 0; font-size: 24px; }
  .forecast-card .range { font-size: 13px; font-weight: 720; }

  .loading-state,
  .error-state,
  .empty-state {
    min-height: 420px;
    display: grid;
    place-items: center;
    text-align: center;
    color: rgba(31,37,43,0.56);
  }

  .loading-state strong,
  .error-state strong,
  .empty-state strong {
    display: block;
    color: var(--ink);
    font-size: 24px;
    margin-bottom: 10px;
  }

  .loader {
    width: 44px;
    height: 44px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px solid rgba(31,37,43,0.12);
    border-top-color: var(--accent);
    animation: spin 780ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 960px) {
    .detail-grid { grid-template-columns: 1fr; }
    .forecast-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  @media (max-width: 700px) {
    .topbar { align-items: flex-start; }
    .time-pill { display: none; }
    .search-hero, .detail-hero, .panel { border-radius: 24px; }
    .search-box { grid-template-columns: 38px 1fr 38px; min-height: 60px; }
    .primary-btn { grid-column: 1 / -1; width: 100%; margin-top: 8px; }
    .hero-title { font-size: 44px; }
    .metric-grid { grid-template-columns: 1fr; }
    .forecast-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
    .forecast-card { min-width: 76px; }
    .detail-hero { min-height: 360px; }
    .detail-hero-content { padding: 22px; }
  }
</style>
</head>
<body>
<div class="scene" id="scene"></div>

<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Krick's Weather</h1>
        <p>天气与城市景色，不并排，先搜再看</p>
      </div>
    </div>
    <button class="back-btn" id="backBtn" type="button">← 返回搜索</button>
    <div class="time-pill" id="timePill"></div>
  </header>

  <section class="view search-view active" id="searchView">
    <div class="search-hero">
      <div class="eyebrow">Weather portrait</div>
      <div class="hero-title">搜索一座城，看见它的<span>天气</span>与景色。</div>
      <p class="hero-copy">输入中国城市、区县或更完整的地名。结果会进入详情页，并优先配上这座城市最有代表性的景色。</p>

      <div class="search-wrap">
        <form class="search-box" id="searchForm">
          <div class="search-icon" aria-hidden="true">⌕</div>
          <input class="search-input" id="searchInput" type="search" placeholder="试试：北京、上海、杭州、成都..." autocomplete="off">
          <button class="icon-btn" id="clearBtn" type="button" aria-label="清空搜索">×</button>
          <button class="primary-btn" type="submit">搜索天气</button>
        </form>
        <div class="suggestions" id="suggestions"></div>
      </div>

      <div class="quick-row" id="quickRow"></div>
    </div>
  </section>

  <section class="view detail-view" id="detailView">
    <div class="detail-shell">
      <div class="detail-hero" id="detailHero">
        <div class="detail-hero-content">
          <div class="place-line">
            <div class="place-title" id="placeTitle">城市</div>
            <div class="place-tag" id="placeTag">代表景色</div>
          </div>
      <div class="place-copy" id="placeCopy">搜索一个中国城市后，这里会展示天气与代表景色。</div>
        </div>
      </div>

      <div class="detail-grid">
        <article class="panel weather-panel" id="weatherPanel">
          <div class="empty-state">
            <div>
              <strong>先搜索，再进入详情</strong>
              <p>搜索结果出现后，这里会变成城市天气信息卡。</p>
            </div>
          </div>
        </article>

        <aside class="panel story-panel" id="storyPanel">
          <div>
            <div class="story-title">地方介绍</div>
            <div class="story-note" id="storyNote">选定城市后，这里会显示代表景点与天气概况。</div>
          </div>
          <div class="story-block">
            <span>城市状态</span>
            <strong id="storyWeather">等待搜索</strong>
          </div>
          <div class="story-block">
            <span>代表景色</span>
            <strong id="storyLandmark">未选择</strong>
          </div>
          <div class="story-block">
            <span>地理信息</span>
            <strong id="storyGeo">--</strong>
          </div>
        </aside>
      </div>
    </div>
  </section>
</main>

<script>
const scene = document.getElementById('scene');
const timePill = document.getElementById('timePill');
const backBtn = document.getElementById('backBtn');
const searchView = document.getElementById('searchView');
const detailView = document.getElementById('detailView');
const searchForm = document.getElementById('searchForm');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const suggestions = document.getElementById('suggestions');
const quickRow = document.getElementById('quickRow');
const detailHero = document.getElementById('detailHero');
const placeTitle = document.getElementById('placeTitle');
const placeTag = document.getElementById('placeTag');
const placeCopy = document.getElementById('placeCopy');
const weatherPanel = document.getElementById('weatherPanel');
const storyNote = document.getElementById('storyNote');
const storyWeather = document.getElementById('storyWeather');
const storyLandmark = document.getElementById('storyLandmark');
const storyGeo = document.getElementById('storyGeo');

const weatherCodes = {
  0: ['晴天', '☀️'], 1: ['少云', '🌤️'], 2: ['多云', '⛅'], 3: ['阴天', '☁️'],
  45: ['有雾', '🌫️'], 48: ['雾凇', '🌫️'], 51: ['小毛毛雨', '🌦️'], 53: ['毛毛雨', '🌦️'],
  55: ['强毛毛雨', '🌧️'], 61: ['小雨', '🌧️'], 63: ['中雨', '🌧️'], 65: ['大雨', '🌧️'],
  71: ['小雪', '🌨️'], 73: ['中雪', '🌨️'], 75: ['大雪', '❄️'], 77: ['雪粒', '❄️'],
  80: ['阵雨', '🌦️'], 81: ['强阵雨', '🌧️'], 82: ['暴雨', '🌧️'],
  85: ['阵雪', '🌨️'], 86: ['强阵雪', '❄️'], 95: ['雷暴', '⛈️'], 96: ['雷暴伴冰雹', '⛈️'], 99: ['强雷暴冰雹', '⛈️']
};

const landmarkMap = {
  '北京': ['故宫', '故宫博物院'],
  '上海': ['外滩', '黄浦江'],
  '天津': ['天津之眼', '海河'],

  '大理': ['洱海', '大理古城'],
  '丽江': ['丽江古城', '玉龙雪山'],
  '昆明': ['滇池', '西山'],
  '桂林': ['漓江', '象鼻山'],
  '拉萨': ['布达拉宫', '八廓街'],
  '三亚': ['亚龙湾', '天涯海角'],
  '香港': ['维多利亚港', '太平山'],
  '澳门': ['大三巴牌坊', '澳门塔'],
  '台北': ['台北101', '中正纪念堂'],
  '哈尔滨': ['圣索菲亚教堂', '中央大街'],
  '郑州': ['少林寺', '中原福塔'],

  '福州': ['三坊七巷', '鼓山'],
  '贵阳': ['甲秀楼', '青岩古镇'],
  '南宁': ['青秀山', '南湖公园'],
  '乌鲁木齐': ['天山天池', '红山公园'],
  '呼和浩特': ['大召寺', '敕勒川草原'],
  '银川': ['镇北堡西部影城', '沙湖'],
  '深圳': ['深圳湾公园', '大梅沙'],
  '广州': ['广州塔', '珠江夜游']
};

const quickCities = ['北京', '上海', '杭州', '成都', '重庆', '厦门', '西安', '广州'];
const placeCache = new Map();
const imageCache = new Map();
let currentSuggestions = [];
let activeIndex = -1;
let debounceTimer = null;
let currentPlace = null;

function updateClock() {
  timePill.textContent = new Intl.DateTimeFormat('zh-CN', {
    month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit'
  }).format(new Date());
}

function weatherInfo(code) {
  const [desc, icon] = weatherCodes[code] || ['未知天气', '🌡️'];
  return { desc, icon };
}

function formatLabel(place) {
  return [place.name, place.admin1].filter(Boolean).join(' · ');
}

function isChinese(text) {
  return /[\u4e00-\u9fff]/.test(text || '');
}

function showSearchView() {
  searchView.classList.add('active');
  detailView.classList.remove('active');
  backBtn.classList.remove('visible');
  document.title = "Krick's Weather · 城市景色";
  setSceneImage(null);
}

function showDetailView() {
  searchView.classList.remove('active');
  detailView.classList.add('active');
  backBtn.classList.add('visible');
}

function setSceneImage(url) {
  if (!url) {
    scene.style.setProperty('--image-opacity', '0');
    return;
  }
  const img = new Image();
  img.onload = () => {
    scene.style.setProperty('--place-image', `url("${url}")`);
    scene.style.setProperty('--image-opacity', '0.78');
  };
  img.onerror = () => scene.style.setProperty('--image-opacity', '0');
  img.src = url;
}

function setHeroImage(url) {
  if (!url) {
    detailHero.style.setProperty('--hero-opacity', '0');
    return;
  }
  const img = new Image();
  img.onload = () => {
    detailHero.style.setProperty('--hero-image', `url("${url}")`);
    detailHero.style.setProperty('--hero-opacity', '1');
  };
  img.onerror = () => detailHero.style.setProperty('--hero-opacity', '0');
  img.src = url;
}

function showLoading(cityName) {
  weatherPanel.innerHTML = `
    <div class="loading-state">
      <div>
        <div class="loader"></div>
        <strong>正在打开展示页</strong>
        <p>${cityName} 的天气和景色正在同步。</p>
      </div>
    </div>`;
}

function showError(message) {
  weatherPanel.innerHTML = `
    <div class="error-state">
      <div>
        <strong>加载失败</strong>
        <p>${message}</p>
      </div>
    </div>`;
}

function renderQuickCities() {
  quickRow.innerHTML = quickCities.map(city => `<button class="mini-btn" type="button">${city}</button>`).join('');
}

async function searchPlaces(query) {
  const providers = [
    async () => {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=12&language=zh&format=json&country_code=CN`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('geocoding failed');
      const data = await resp.json();
      return (data.results || []).filter(item => {
        const code = (item.country_code || '').toLowerCase();
        const country = item.country || '';
        return code === 'cn' || country.includes('中国') || country.includes('中华人民共和国');
      });
    },
    async () => {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&countrycodes=cn&accept-language=zh-CN&q=${encodeURIComponent(query)}`;
      const resp = await fetch(url, { headers: { 'Accept-Language': 'zh-CN' } });
      if (!resp.ok) throw new Error('nominatim failed');
      const data = await resp.json();
      return data.map(item => ({
        name: item.name || item.display_name?.split(',')[0]?.trim() || query,
        latitude: item.lat,
        longitude: item.lon,
        admin1: item.address?.state || item.address?.province || '',
        country: '中国'
      })).filter(Boolean);
    }
  ];

  for (const provider of providers) {
    try {
      const results = await provider();
      if (results.length) return results;
    } catch (error) {}
  }
  return [];
}

async function reverseChinesePlace(place) {
  const key = `${Number(place.latitude).toFixed(3)},${Number(place.longitude).toFixed(3)}`;
  if (placeCache.has(key)) return placeCache.get(key);

  if (isChinese(place.name)) {
    placeCache.set(key, place);
    return place;
  }

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${place.latitude}&lon=${place.longitude}&zoom=10&addressdetails=1&accept-language=zh-CN&countrycodes=cn`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('reverse failed');
    const data = await resp.json();
    const address = data.address || {};
    const candidates = [address.city, address.town, address.village, address.county, address.state, data.name, data.display_name];
    const match = candidates.find(isChinese);
    if (match) {
      const normalized = { ...place, name: match, displayName: match };
      placeCache.set(key, normalized);
      return normalized;
    }
  } catch (error) {}

  placeCache.set(key, place);
  return place;
}

async function normalizePlaces(places) {
  const list = await Promise.all(places.map(reverseChinesePlace));
  return list.filter(Boolean);
}

function renderSuggestions(items) {
  currentSuggestions = items;
  activeIndex = -1;
  if (!items.length) {
    suggestions.innerHTML = '<button class="suggestion" type="button"><span><strong>没有找到匹配地点</strong><span>换一个更具体的名字试试</span></span></button>';
    suggestions.classList.add('show');
    return;
  }
  suggestions.innerHTML = items.map((place, index) => `
    <button class="suggestion" type="button" data-index="${index}">
      <span><strong>${place.name}</strong><span>${place.admin1 || '中国'}</span></span>
      <small>${Number(place.latitude).toFixed(2)}, ${Number(place.longitude).toFixed(2)}</small>
    </button>
  `).join('');
  suggestions.classList.add('show');
}

function hideSuggestions() {
  suggestions.classList.remove('show');
  activeIndex = -1;
}

async function updateSuggestions(value) {
  const query = value.trim();
  clearBtn.classList.toggle('visible', query.length > 0);
  if (query.length < 2) {
    hideSuggestions();
    return;
  }
  try {
    const raw = await searchPlaces(query);
    renderSuggestions(await normalizePlaces(raw));
  } catch (error) {
    renderSuggestions([]);
  }
}

function landmarkFor(place) {
  const name = place.name.replace(/市$|区$|县$|自治州$|盟$|地区$/g, '');
  return landmarkMap[name] || [name, '风景名胜'];
}

async function fetchWikiImage(query) {
  const url = `https://zh.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=1800&format=json&origin=*`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('wiki failed');
  const data = await resp.json();
  const pages = Object.values(data?.query?.pages || {});
  const page = pages.find(item => item.thumbnail && !item.missing);
  return page?.thumbnail?.source || null;
}

async function fetchCommonsImage(query) {
  const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=8&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=1800&format=json&origin=*`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('commons failed');
  const data = await resp.json();
  const pages = Object.values(data?.query?.pages || {});
  const page = pages.find(item => item.imageinfo?.length);
  return page?.imageinfo?.[0]?.thumburl || page?.imageinfo?.[0]?.url || null;
}

async function findSceneryImage(place) {
  const key = `${place.name}-${place.admin1}`;
  if (imageCache.has(key)) return imageCache.get(key);

  const [landmark] = landmarkFor(place);
  const cleanName = place.name.replace(/市$|区$|县$|自治州$|盟$|地区$/g, '');
  const queries = [
    `${cleanName} ${landmark}`,
    landmark,
    `${cleanName} 风景`,
    `${cleanName} 旅游`,
    `${cleanName} 地标`,
    `${cleanName}`,
    `${cleanName} cityscape`
  ].filter(Boolean);

  for (const query of queries) {
    try {
      const wiki = await fetchWikiImage(query);
      if (wiki) {
        imageCache.set(key, wiki);
        return wiki;
      }
    } catch (error) {}

    try {
      const commons = await fetchCommonsImage(query);
      if (commons) {
        imageCache.set(key, commons);
        return commons;
      }
    } catch (error) {}
  }

  imageCache.set(key, null);
  return null;
}

async function fetchWeather(place) {
  currentPlace = place;
  showLoading(place.name);
  showDetailView();
  hideSuggestions();
  searchInput.value = place.name;
  clearBtn.classList.add('visible');

  const weatherUrl =
    `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code' +
    '&daily=temperature_2m_max,temperature_2m_min,weather_code' +
    '&timezone=auto&forecast_days=7';

  try {
    const [weatherResp, imageUrl] = await Promise.all([
      fetch(weatherUrl),
      findSceneryImage(place)
    ]);
    if (!weatherResp.ok) throw new Error('weather failed');

    const data = await weatherResp.json();
    renderWeather(data, place, imageUrl);
  } catch (error) {
    showError('请检查网络连接，或者换一个更明确的地名再试。');
  }
}

function renderWeather(data, place, imageUrl) {
  const current = data.current;
  const daily = data.daily;
  const info = weatherInfo(current.weather_code);
  const today = new Intl.DateTimeFormat('zh-CN', {
    month: 'long', day: 'numeric', weekday: 'long'
  }).format(new Date());

  const landmark = landmarkFor(place)[0];
  const displayName = place.name;
  const label = formatLabel(place);

  const forecast = daily.time.map((date, index) => {
    const dayInfo = weatherInfo(daily.weather_code[index]);
    const dayLabel = index === 0 ? '今天' : new Intl.DateTimeFormat('zh-CN', { weekday: 'short' }).format(new Date(date));
    return `
      <div class="forecast-card">
        <div class="day">${dayLabel}</div>
        <div class="icon">${dayInfo.icon}</div>
        <div class="range">${Math.round(daily.temperature_2m_max[index])}° / ${Math.round(daily.temperature_2m_min[index])}°</div>
      </div>`;
  }).join('');

  document.title = `${displayName} · Krick's Weather`;
  placeTitle.textContent = displayName;
  placeTag.textContent = landmark;
  placeCopy.textContent = `${displayName} 的天气与景色会一起展示。`;
  storyNote.textContent = `${displayName} · ${landmark}。当前天气为 ${info.desc}，今天是 ${today}。`;
  storyWeather.textContent = `${info.desc} · ${Math.round(current.temperature_2m)}°C`;
  storyLandmark.textContent = landmark;
  storyGeo.textContent = `${Number(place.latitude).toFixed(2)}, ${Number(place.longitude).toFixed(2)}`;

  detailHero.style.setProperty('--hero-opacity', imageUrl ? '1' : '0');
  if (imageUrl) setHeroImage(imageUrl);
  setSceneImage(imageUrl);

  weatherPanel.innerHTML = `
    <div>
      <div class="weather-top">
        <div>
          <div class="location-name">${displayName}</div>
          <div class="location-meta">${label} · ${today}</div>
        </div>
        <div class="weather-badge">${info.desc}</div>
      </div>

      <div class="temperature">
        <div class="weather-symbol">${info.icon}</div>
        <strong>${Math.round(current.temperature_2m)}</strong>
        <sup>°C</sup>
      </div>

      <div class="metric-grid">
        <div class="metric"><span>体感温度</span><strong>${Math.round(current.apparent_temperature)}°C</strong></div>
        <div class="metric"><span>空气湿度</span><strong>${current.relative_humidity_2m}%</strong></div>
        <div class="metric"><span>风速</span><strong>${Math.round(current.wind_speed_10m)} km/h</strong></div>
      </div>
    </div>

    <div>
      <div class="story-title" style="margin-bottom:12px;">未来 7 天</div>
      <div class="forecast-list">${forecast}</div>
    </div>
  `;
}

backBtn.addEventListener('click', () => {
  showSearchView();
});

searchInput.addEventListener('input', () => {
  window.clearTimeout(debounceTimer);
  debounceTimer = window.setTimeout(() => updateSuggestions(searchInput.value), 240);
});

searchInput.addEventListener('keydown', (event) => {
  const items = [...suggestions.querySelectorAll('.suggestion[data-index]')];
  if (!items.length) {
    if (event.key === 'Escape') hideSuggestions();
    return;
  }

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
  } else if (event.key === 'Enter' && activeIndex >= 0) {
    event.preventDefault();
    fetchWeather(currentSuggestions[activeIndex]);
    return;
  } else if (event.key === 'Escape') {
    hideSuggestions();
    return;
  }

  items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
});

searchForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const query = searchInput.value.trim();
  if (!query) return;

  try {
    const list = await normalizePlaces(await searchPlaces(query));
    const place = list[0];
    if (!place) {
      showSearchView();
      suggestions.innerHTML = '<button class="suggestion" type="button"><span><strong>没有找到这个地方</strong><span>请换一个更具体的城市名</span></span></button>';
      suggestions.classList.add('show');
      return;
    }
    fetchWeather(place);
  } catch (error) {
    showSearchView();
    suggestions.innerHTML = '<button class="suggestion" type="button"><span><strong>搜索失败</strong><span>请稍后再试</span></span></button>';
    suggestions.classList.add('show');
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  hideSuggestions();
  searchInput.focus();
});

suggestions.addEventListener('click', (event) => {
  const item = event.target.closest('.suggestion[data-index]');
  if (!item) return;
  fetchWeather(currentSuggestions[Number(item.dataset.index)]);
});

quickRow.addEventListener('click', async (event) => {
  const button = event.target.closest('.mini-btn');
  if (!button) return;
  searchInput.value = button.textContent.trim();
  clearBtn.classList.add('visible');
  try {
    const list = await normalizePlaces(await searchPlaces(button.textContent.trim()));
    if (list[0]) fetchWeather(list[0]);
  } catch (error) {}
});

document.addEventListener('click', (event) => {
  if (!event.target.closest('.search-wrap')) hideSuggestions();
});

updateClock();
renderQuickCities();
setInterval(updateClock, 30000);
showSearchView();
</script>
