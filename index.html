<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Krick's Weather 是一张清爽的城市天气卡片，手机打开即可搜索城市、查看实时天气、七日趋势和出行提醒。">
<meta name="theme-color" content="#eaf5fb">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Krick's Weather">
<meta property="og:description" content="搜索一座城，看见天气、趋势和出行提醒。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://krick7.github.io/kricks-weather/">
<title>Krick's Weather</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --soft: #86868b;
    --blue: #0071e3;
    --blue-strong: #005bbf;
    --green: #2ea043;
    --orange: #bf7a00;
    --paper: rgba(255, 255, 255, 0.82);
    --paper-strong: rgba(255, 255, 255, 0.94);
    --line: rgba(0, 0, 0, 0.08);
    --line-strong: rgba(0, 0, 0, 0.14);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.10);
    --radius-lg: 30px;
    --radius-md: 22px;
    --radius-sm: 14px;
  }

  html {
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.78) 0%, rgba(245, 245, 247, 0.96) 34%, #f5f5f7 100%),
      linear-gradient(135deg, rgba(0, 113, 227, 0.12), transparent 42%, rgba(52, 199, 89, 0.10));
    overflow-x: hidden;
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
  }

  .ambient::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: var(--place-image);
    background-size: cover;
    background-position: center;
    opacity: var(--place-opacity, 0);
    filter: saturate(1.02);
    transform: scale(1.04);
    transition: opacity 900ms ease;
  }

  .ambient::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(245, 245, 247, 0.76), rgba(245, 245, 247, 0.42) 42%, #f5f5f7 100%),
      linear-gradient(110deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.42));
    backdrop-filter: blur(18px) saturate(1.08);
  }

  .shell {
    width: min(1180px, calc(100% - 32px));
    min-height: 100vh;
    margin: 0 auto;
    padding: 18px 0 42px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 24px;
  }

  .topbar {
    position: sticky;
    top: 10px;
    z-index: 40;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 9px 10px 9px 12px;
    border: 1px solid rgba(255, 255, 255, 0.74);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.66);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(28px) saturate(1.28);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    border-radius: 10px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.12)),
      linear-gradient(135deg, #0a84ff, #64d2ff 46%, #30d158);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), 0 8px 20px rgba(0, 113, 227, 0.24);
    position: relative;
    overflow: hidden;
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    left: 9px;
    right: 9px;
    bottom: 9px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 -8px 0 rgba(255, 255, 255, 0.36);
  }

  .brand-title {
    margin: 0;
    font-size: 17px;
    line-height: 1;
    font-weight: 760;
    letter-spacing: 0;
  }

  .brand-subtitle {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .top-actions {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .time-chip,
  .back-btn {
    min-height: 38px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.72);
    color: var(--muted);
    backdrop-filter: blur(18px);
  }

  .time-chip {
    display: inline-flex;
    align-items: center;
    padding: 0 13px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }

  .back-btn {
    display: none;
    align-items: center;
    gap: 7px;
    padding: 0 13px;
    border-radius: 999px;
    cursor: pointer;
  }

  .back-btn.visible { display: inline-flex; }

  .view { display: none; }
  .view.active { display: block; }

  .search-view {
    align-self: center;
    min-height: calc(100vh - 112px);
    display: grid;
    align-items: center;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 920px);
    justify-content: center;
    align-items: center;
  }

  .hero-copy-panel {
    position: relative;
    min-height: min(720px, calc(100vh - 148px));
    padding: clamp(240px, 35vh, 340px) clamp(30px, 5vw, 58px) clamp(30px, 5vw, 58px);
    overflow: hidden;
    border: 1px solid rgba(93, 230, 255, 0.22);
    border-radius: var(--radius-lg);
    background:
      linear-gradient(180deg, rgba(3, 10, 30, 0.62), rgba(3, 8, 24, 0.94)),
      #020617;
    color: #fff;
    box-shadow: 0 30px 88px rgba(0, 14, 38, 0.24);
    backdrop-filter: blur(26px) saturate(1.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
  }

  .hero-copy-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(2, 6, 23, 0.06) 0%, rgba(2, 6, 23, 0.32) 58%, rgba(2, 6, 23, 0.86) 100%),
      radial-gradient(circle at 50% 24%, rgba(0, 216, 255, 0.16), transparent 44%);
  }

  .hero-copy-panel > :not(.holo-stage) {
    position: relative;
    z-index: 1;
  }

  .holo-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .holo-stage canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hero-copy-panel .eyebrow {
    color: #64d2ff;
    text-shadow: 0 0 24px rgba(100, 210, 255, 0.54);
  }

  .hero-copy-panel .hero-title {
    color: #fff;
    text-shadow: 0 20px 56px rgba(0, 0, 0, 0.42);
  }

  .hero-copy-panel .hero-title span {
    color: #5ee7ff;
  }

  .hero-copy-panel .hero-text,
  .hero-copy-panel .search-note {
    color: rgba(255, 255, 255, 0.74);
  }

  .hero-copy-panel .search-box {
    background: rgba(255, 255, 255, 0.94);
    border-color: rgba(255, 255, 255, 0.54);
    box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
  }

  .hero-copy-panel .chip-btn {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
  }

  .hero-copy-panel .chip-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.22);
  }

  .eyebrow {
    margin: 0 0 14px;
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .hero-title {
    max-width: 820px;
    margin: 0;
    font-size: clamp(46px, 7vw, 92px);
    line-height: 0.98;
    letter-spacing: 0;
    font-weight: 800;
  }

  .hero-title span {
    color: var(--blue);
  }

  .hero-text {
    max-width: 680px;
    margin: 24px 0 30px;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.58;
  }

  .search-wrap {
    position: relative;
    width: min(690px, 100%);
    margin: 0 auto;
  }

  .search-box {
    min-height: 66px;
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) 42px 112px;
    align-items: center;
    gap: 8px;
    padding: 7px;
    border: 1px solid rgba(0, 0, 0, 0.09);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.08);
    transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
  }

  .search-box:focus-within {
    transform: translateY(-1px);
    border-color: rgba(0, 113, 227, 0.34);
    box-shadow: 0 18px 46px rgba(0, 113, 227, 0.14);
  }

  .search-symbol {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #f5f5f7;
    color: var(--soft);
    font-size: 20px;
  }

  .search-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font-size: 18px;
    padding: 0 4px;
  }

  .search-input::placeholder { color: #98989d; }

  .clear-btn,
  .primary-btn,
  .chip-btn,
  .suggestion {
    border: 0;
    cursor: pointer;
    transition: transform 160ms ease, background 160ms ease, opacity 160ms ease, color 160ms ease;
  }

  .clear-btn {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #f5f5f7;
    color: var(--soft);
    font-size: 20px;
    opacity: 0;
    pointer-events: none;
  }

  .clear-btn.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .primary-btn {
    height: 50px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }

  .primary-btn:hover,
  .chip-btn:hover,
  .back-btn:hover,
  .clear-btn:hover {
    transform: translateY(-1px);
  }

  .primary-btn:hover { background: var(--blue-strong); }

  .suggestions {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 30;
    display: none;
    max-height: 330px;
    overflow: auto;
    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(24px);
  }

  .suggestions.show { display: block; }

  .suggestion {
    width: 100%;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 16px;
    background: transparent;
    color: var(--ink);
    text-align: left;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .suggestion:last-child { border-bottom: 0; }
  .suggestion:hover,
  .suggestion.active { background: rgba(0, 113, 227, 0.08); }
  .suggestion strong { display: block; font-size: 15px; }
  .suggestion span span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .suggestion small { color: var(--soft); white-space: nowrap; }

  .quick-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }

  .search-note {
    max-width: 620px;
    margin: 16px auto 0;
    color: var(--soft);
    font-size: 13px;
    line-height: 1.6;
  }

  .chip-btn {
    min-height: 36px;
    padding: 0 15px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.84);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }

  .chip-btn:hover {
    color: var(--ink);
    background: #fff;
  }

  .preview-panel {
    min-height: 570px;
    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: var(--radius-lg);
    background:
      linear-gradient(180deg, rgba(29, 29, 31, 0.04), rgba(29, 29, 31, 0.00)),
      rgba(255, 255, 255, 0.62);
    box-shadow: var(--shadow);
    backdrop-filter: blur(26px) saturate(1.18);
    padding: 24px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 18px;
    overflow: hidden;
  }

  .preview-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .preview-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .signal {
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(52, 199, 89, 0.14);
    color: #208a3b;
    font-size: 12px;
    font-weight: 700;
  }

  .preview-main {
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.76);
    background:
      linear-gradient(180deg, rgba(10, 132, 255, 0.18), rgba(100, 210, 255, 0.10) 48%, rgba(255, 255, 255, 0.66)),
      linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.48));
    display: grid;
    align-content: end;
    min-height: 300px;
    padding: 24px;
  }

  .preview-temp {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .preview-temp strong {
    font-size: clamp(84px, 12vw, 118px);
    line-height: 0.84;
    letter-spacing: 0;
    font-weight: 780;
  }

  .preview-temp sup {
    margin-top: 8px;
    color: var(--muted);
    font-size: 30px;
    font-weight: 700;
  }

  .preview-copy {
    max-width: 330px;
    margin: 14px 0 0;
    color: var(--muted);
    line-height: 1.58;
  }

  .city-stack {
    display: grid;
    gap: 10px;
  }

  .city-row {
    min-height: 58px;
    display: grid;
    grid-template-columns: 38px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(0, 0, 0, 0.06);
  }

  .city-row i {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #f5f5f7;
    font-style: normal;
  }

  .city-row strong {
    display: block;
    font-size: 14px;
  }

  .city-row span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .detail-view { padding-bottom: 8px; }

  .detail-stack {
    display: grid;
    gap: 18px;
  }

  .detail-grid > *,
  .main-column > *,
  .side-column > * {
    min-width: 0;
  }

  .hero-card {
    position: relative;
    min-height: 440px;
    overflow: hidden;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.72);
    background:
      linear-gradient(135deg, rgba(10, 132, 255, 0.26), rgba(255, 255, 255, 0.42)),
      #dbe6f3;
    box-shadow: var(--shadow);
  }

  .hero-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: var(--hero-image);
    background-size: cover;
    background-position: center;
    opacity: var(--hero-opacity, 0);
    transform: scale(1.03);
    transition: opacity 900ms ease;
  }

  .hero-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.24) 48%, rgba(0, 0, 0, 0.66) 100%);
  }

  .hero-content {
    position: absolute;
    inset: auto 0 0;
    z-index: 1;
    padding: clamp(24px, 4vw, 38px);
    color: #fff;
  }

  .hero-kicker {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .pill {
    min-height: 32px;
    display: inline-flex;
    align-items: center;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.20);
    border: 1px solid rgba(255, 255, 255, 0.24);
    color: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(18px);
    font-size: 12px;
    font-weight: 700;
  }

  .place-title {
    margin: 0;
    font-size: clamp(46px, 8vw, 94px);
    line-height: 0.92;
    letter-spacing: 0;
    font-weight: 820;
  }

  .place-copy {
    max-width: 760px;
    margin: 16px 0 0;
    color: rgba(255, 255, 255, 0.84);
    line-height: 1.62;
    font-size: 16px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.34fr) minmax(320px, 0.66fr);
    gap: 18px;
  }

  .main-column,
  .side-column {
    display: grid;
    align-content: start;
    gap: 18px;
  }

  .panel {
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 255, 255, 0.76);
    background: rgba(255, 255, 255, 0.76);
    box-shadow: 0 16px 46px rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(24px) saturate(1.16);
    padding: clamp(18px, 3vw, 26px);
  }

  .current-panel {
    display: grid;
    gap: 20px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .panel-title {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 760;
    letter-spacing: 0;
  }

  .location-name {
    margin: 7px 0 0;
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.08;
    font-weight: 780;
    letter-spacing: 0;
  }

  .location-meta {
    margin-top: 7px;
    color: var(--muted);
    font-size: 13px;
  }

  .weather-badge {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 13px;
    border-radius: 999px;
    background: rgba(0, 113, 227, 0.10);
    color: var(--blue);
    font-size: 12px;
    font-weight: 760;
    white-space: nowrap;
  }

  .temperature-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 18px;
    align-items: end;
  }

  .weather-icon {
    font-size: clamp(56px, 8vw, 84px);
    line-height: 1;
  }

  .temperature {
    display: flex;
    align-items: flex-start;
    min-width: 0;
  }

  .temperature strong {
    font-size: clamp(94px, 14vw, 152px);
    line-height: 0.82;
    letter-spacing: 0;
    font-weight: 780;
  }

  .temperature sup {
    margin-top: 9px;
    color: var(--muted);
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
  }

  .weather-summary {
    margin: 0;
    color: var(--muted);
    line-height: 1.68;
    font-size: 15px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .metric,
  .tip,
  .forecast-card,
  .hour-card {
    border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(245, 245, 247, 0.76);
  }

  .metric {
    min-height: 92px;
    padding: 14px;
    display: grid;
    align-content: space-between;
    gap: 10px;
  }

  .metric span,
  .forecast-card span,
  .hour-card span,
  .tip span,
  .story-label {
    color: var(--muted);
    font-size: 12px;
  }

  .metric strong {
    display: block;
    font-size: 18px;
    line-height: 1.1;
  }

  .forecast-list {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 9px;
  }

  .forecast-card {
    min-height: 136px;
    padding: 12px 9px;
    display: grid;
    align-content: center;
    gap: 8px;
    text-align: center;
  }

  .forecast-card strong { font-size: 14px; }
  .forecast-card .forecast-icon { font-size: 25px; line-height: 1; }
  .forecast-card small { color: var(--muted); font-size: 11px; }

  .hour-row {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(8, minmax(86px, 1fr));
    gap: 9px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .hour-card {
    min-height: 106px;
    padding: 12px 9px;
    display: grid;

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function randomIndex(length) {
  if (!length) return 0;
  if (window.crypto?.getRandomValues) {
    const values = new Uint32Array(1);
    window.crypto.getRandomValues(values);
    return values[0] % length;
  }
  return Math.floor(Math.random() * length);
}

function pickRandom(items) {
  return items[randomIndex(items.length)];
}

function shuffled(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swapIndex = randomIndex(index + 1);
    [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
  }
  return copy;
}

function uniqueItems(items) {
  return [...new Set(items.filter(Boolean))];
}

function renderEntryCopy() {
  const copy = pickRandom(entryCopies);

  heroText.textContent = copy.text;
  searchNote.textContent = copy.note;
}

  }

  const coastlines = [
    [[58, 72], [58, 98], [62, 126], [52, 142], [42, 146], [36, 139], [31, 122], [24, 118], [16, 108], [9, 103], [1, 104], [-7, 108], [-8, 118], [-2, 126], [-6, 136], [-15, 145], [-25, 153], [-38, 146], [-36, 118], [-22, 114], [-13, 126], [-6, 130]],
    [[45, 126], [39, 128], [36, 126], [34, 129], [35, 135], [39, 141], [43, 144]],
    [[31, 77], [25, 72], [19, 73], [8, 78], [10, 85], [20, 88], [25, 93], [22, 98], [18, 96]],
    [[63, -166], [57, -137], [49, -124], [36, -122], [25, -111], [16, -97], [9, -82], [-5, -79], [-16, -76], [-34, -72], [-53, -70]],
    [[62, -55], [58, -30], [52, 2], [44, 28], [35, 45], [27, 55], [20, 72], [10, 78], [1, 44], [-10, 38], [-23, 28], [-35, 18], [-34, 32], [-20, 45], [2, 51], [17, 39], [31, 31]],
    [[69, 18], [60, 32], [54, 48], [44, 58], [40, 72], [48, 91], [56, 105]]
  ];

  const routes = [
    { from: [39.9, 116.4], to: [31.2, 121.5], color: '#6f9fbd', bend: 8, offset: 0.04 },
    { from: [39.9, 116.4], to: [35.7, 139.7], color: '#8fb4cc', bend: 15, offset: 0.22 },
    { from: [31.2, 121.5], to: [22.5, 114.1], color: '#d9b58c', bend: 6, offset: 0.40 },
    { from: [30.6, 104.1], to: [1.3, 103.8], color: '#b6c9a7', bend: 18, offset: 0.58 },
    { from: [22.5, 114.1], to: [-33.9, 151.2], color: '#88bdb8', bend: 20, offset: 0.76 },
    { from: [31.2, 121.5], to: [25.0, 121.5], color: '#a7cce0', bend: 5, offset: 0.88 }
  ];

  function resize() {
    const rect = panel.getBoundingClientRect();
    const nextWidth = Math.max(1, Math.floor(rect.width));
    const nextHeight = Math.max(1, Math.floor(rect.height));
    const nextDpr = Math.min(window.devicePixelRatio || 1, 2);
    if (nextWidth === width && nextHeight === height && nextDpr === dpr) return;

    width = nextWidth;
    height = nextHeight;
    dpr = nextDpr;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function project(lat, lon) {
    const latRad = lat * DEG;
    const lonRad = (lon + rotationY) * DEG;
    const cosLat = Math.cos(latRad);
    const x = cosLat * Math.sin(lonRad);
    const y = Math.sin(latRad);
    const z = cosLat * Math.cos(lonRad);
    const y2 = y * tiltCos - z * tiltSin;
    const z2 = y * tiltSin + z * tiltCos;
    const perspective = 1 + z2 * 0.08;

    return {
      x: centerX + x * radius * perspective,
      y: centerY - y2 * radius * perspective,
      z: z2,
      visible: z2 > -0.08
    };
  }

  function drawProjectedPath(points, color, lineWidth, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 12;
    ctx.shadowColor = color;
    ctx.beginPath();

    let open = false;
    points.forEach(([lat, lon]) => {
      const point = project(lat, lon);
      if (!point.visible) {
        open = false;
        return;
      }
      if (!open) {
        ctx.moveTo(point.x, point.y);
        open = true;
      } else {
        ctx.lineTo(point.x, point.y);
      }
    });

    ctx.stroke();
    ctx.restore();
  }

  function routePoint(route, progress) {
    const [fromLat, fromLon] = route.from;
    const [toLat, toLon] = route.to;
    let lonDelta = toLon - fromLon;
    if (lonDelta > 180) lonDelta -= 360;
    if (lonDelta < -180) lonDelta += 360;
    const lift = Math.sin(progress * Math.PI) * route.bend;
    return [
      fromLat + (toLat - fromLat) * progress + lift,
      fromLon + lonDelta * progress
    ];
  }

  function drawRoute(route, seconds) {
    const path = [];
    for (let step = 0; step <= 42; step += 1) {
      path.push(routePoint(route, step / 42));
    }
    drawProjectedPath(path, route.color, 1.2, 0.22);

    const head = (seconds * (reduceMotion ? 0.06 : 0.18) + route.offset) % 1;
    for (let index = 0; index < 10; index += 1) {
      const progress = (head - index * 0.018 + 1) % 1;
      const point = project(...routePoint(route, progress));
      if (!point.visible) continue;

      const alpha = Math.max(0, 0.92 - index * 0.085);
      const size = 3.2 - index * 0.16;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = route.color;
      ctx.shadowBlur = 16;
      ctx.shadowColor = route.color;
      ctx.beginPath();
      ctx.arc(point.x, point.y, size, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawGridLine(isLatitude, value) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100, 210, 255, 0.18)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    let open = false;

    const start = isLatitude ? -180 : -78;
    const end = isLatitude ? 180 : 78;
    for (let value2 = start; value2 <= end; value2 += 5) {
      const lat = isLatitude ? value : value2;
      const lon = isLatitude ? value2 : value;
      const point = project(lat, lon);
      if (!point.visible) {
        open = false;
        continue;
      }
      if (!open) {
        ctx.moveTo(point.x, point.y);
        open = true;
      } else {
        ctx.lineTo(point.x, point.y);
      }
    }

    ctx.stroke();
    ctx.restore();
  }

  function drawFrame(now) {
    resize();
    if (width < 2 || height < 2) {
      window.requestAnimationFrame(drawFrame);
      return;
    }

    const seconds = now / 1000;
    pointerX += (targetX - pointerX) * 0.045;
    pointerY += (targetY - pointerY) * 0.045;
    radius = Math.min(width, height) * (width < 560 ? 0.43 : 0.39);
    centerX = width * 0.5;
    centerY = height * (width < 560 ? 0.29 : 0.34);
    rotationY = -118 + pointerX + seconds * (reduceMotion ? 0.55 : 4.2);
    const rotationX = -8 + pointerY;
    tiltCos = Math.cos(rotationX * DEG);
    tiltSin = Math.sin(rotationX * DEG);

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = 'rgba(226, 243, 251, 0.08)';
    ctx.fillRect(0, 0, width, height);

    for (let index = 0; index < 70; index += 1) {
      const x = (index * 97) % Math.max(width, 1);
      const y = ((index * 53) % Math.max(height * 0.64, 1));
      const alpha = 0.12 + Math.sin(seconds + index) * 0.05;
      ctx.fillStyle = `rgba(102, 152, 183, ${alpha})`;
      ctx.fillRect(x, y, 1, 1);
    }

    const glow = ctx.createRadialGradient(centerX - radius * 0.24, centerY - radius * 0.32, radius * 0.04, centerX, centerY, radius);
    glow.addColorStop(0, 'rgba(255, 255, 255, 0.70)');
    glow.addColorStop(0.46, 'rgba(126, 168, 196, 0.38)');
    glow.addColorStop(1, 'rgba(84, 132, 162, 0.18)');

    ctx.save();
    ctx.shadowBlur = 42;
    ctx.shadowColor = 'rgba(93, 145, 177, 0.32)';
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, TAU);
    ctx.fillStyle = glow;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(78, 132, 166, 0.52)';
    ctx.stroke();
    ctx.restore();

    for (let lat = -60; lat <= 60; lat += 15) drawGridLine(true, lat);
    for (let lon = -180; lon < 180; lon += 15) drawGridLine(false, lon);

    dots.forEach((dot) => {
      const point = project(dot.lat, dot.lon);
      if (!point.visible) return;
      const pulse = 0.08 + Math.sin(seconds * 1.8 + dot.glow * 8) * 0.04;
      const alpha = Math.min(0.72, 0.16 + point.z * 0.34 + dot.glow * 0.08 + pulse);
      ctx.fillStyle = `rgba(58, 110, 145, ${Math.max(0.08, alpha)})`;
      ctx.fillRect(point.x, point.y, width < 560 ? 0.85 : 1.05, width < 560 ? 0.85 : 1.05);
    });

    coastlines.forEach((line) => drawProjectedPath(line, '#4f8db1', 1.35, 0.66));
    routes.forEach((route) => drawRoute(route, seconds));

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#6f9fbd';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius * 1.06, -0.2 + seconds * 0.18, 0.9 + seconds * 0.18);
    ctx.stroke();
    ctx.restore();

    window.requestAnimationFrame(drawFrame);
  }

  function updatePointer(event) {
    const rect = panel.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    targetX = ((event.clientX - rect.left) / rect.width - 0.5) * 18;
    targetY = ((event.clientY - rect.top) / rect.height - 0.5) * -10;
  }

  window.addEventListener('pointermove', updatePointer, { passive: true });
  window.addEventListener('resize', resize, { passive: true });
  window.requestAnimationFrame(drawFrame);
}

}

function searchChinaCityIndex(query, limit = 12) {
  const needle = query.trim().replace(/\s+/g, '');
  if (!needle) return [];
  const withoutCitySuffix = needle.replace(/市$/u, '');
  const scored = [];

  for (const city of CHINA_CITY_INDEX) {
    const fields = [
      city.name,
      city.name.replace(/(市|地区|盟|自治州|特别行政区)$/u, ''),
      ...(city.alias || []),
      city.admin1
    ].filter(Boolean);
    let score = 0;

    for (const field of fields) {
      const value = String(field).replace(/\s+/g, '');
      if (value === needle || value === withoutCitySuffix) score = Math.max(score, 100);
      else if (value.startsWith(needle) || value.startsWith(withoutCitySuffix)) score = Math.max(score, 86);
      else if (value.includes(needle) || value.includes(withoutCitySuffix)) score = Math.max(score, 68);
    }

    if (score) {
      if (city.level === 'prefecture') score += 8;
      scored.push({
        score,
        name: city.name,
        latitude: city.lat,
        longitude: city.lng,
        admin1: city.admin1,
        country: '中国'
      });
    }
  }

  return scored
    .sort((a, b) => b.score - a.score || a.name.length - b.name.length)
    .slice(0, limit)
    .map(({ score, ...place }) => place);
}

async function fetchJSONFrom(urls, message) {
  let lastError = null;
  for (const url of urls) {
    try {
      const controller = window.AbortController ? new AbortController() : null;
      const timer = controller ? window.setTimeout(() => controller.abort(), 12000) : null;
      const resp = await fetch(url, controller ? { signal: controller.signal } : undefined);
      if (timer) window.clearTimeout(timer);
      if (!resp.ok) throw new Error(`${message}: ${resp.status}`);
      return await resp.json();
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error(message);
}

async function searchPlaces(query) {
  const localResults = searchChinaCityIndex(query);
  if (localResults.length) return dedupePlaces(localResults);

  const providers = [
    async () => {
      const params = new URLSearchParams({
        name: query,
        count: '12',
        language: 'zh',
        format: 'json',
        country_code: 'CN'
      });
      const data = await fetchJSONFrom(requestOrder(
        `/api/geocode?${params}`,
        `https://geocoding-api.open-meteo.com/v1/search?${params}`
      ), 'Open-Meteo 地名搜索失败');
      return (data.results || [])
        .filter((item) => {
          const code = (item.country_code || '').toLowerCase();
          const country = item.country || '';
          return code === 'cn' || country.includes('中国') || country.includes('中华人民共和国');
        })
        .map((item) => ({
          name: item.name,
          latitude: Number(item.latitude),
          longitude: Number(item.longitude),
          admin1: item.admin1 || '',
          country: item.country || '中国'
        }));
    },
    async () => {
      const params = new URLSearchParams({
        format: 'jsonv2',
        limit: '12',
        countrycodes: 'cn',
        addressdetails: '1',
        'accept-language': 'zh-CN',
        q: query
      });
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
        headers: { 'Accept-Language': 'zh-CN' }
      });
      if (!resp.ok) throw new Error('OpenStreetMap 地名搜索失败');
      const data = await resp.json();
      return data.map((item) => ({
        name: item.name || item.display_name?.split(',')[0]?.trim() || query,
        latitude: Number(item.lat),
        longitude: Number(item.lon),
        admin1: item.address?.state || item.address?.province || '',
        country: '中国'
      })).filter((item) => Number.isFinite(item.latitude) && Number.isFinite(item.longitude));
    }
  ];

  for (const provider of providers) {
    try {
      const results = await provider();
      if (results.length) return dedupePlaces(results);
    } catch (error) {}
  }
  return [];
}

function dedupePlaces(places) {
  const seen = new Set();
  return places.filter((place) => {
    const key = `${cleanCityName(place.name)}-${Number(place.latitude).toFixed(2)}-${Number(place.longitude).toFixed(2)}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return place.name && Number.isFinite(place.latitude) && Number.isFinite(place.longitude);
  });
}

async function reverseChinesePlace(place) {
  const key = `${Number(place.latitude).toFixed(3)},${Number(place.longitude).toFixed(3)}`;
  if (placeCache.has(key)) return placeCache.get(key);

  if (isChinese(place.name)) {
    placeCache.set(key, place);
    return place;
  }

  try {
    const params = new URLSearchParams({
      format: 'jsonv2',
      lat: place.latitude,
      lon: place.longitude,
      zoom: '10',
      addressdetails: '1',
      'accept-language': 'zh-CN',
      countrycodes: 'cn'
    });
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?${params}`);
    if (!resp.ok) throw new Error('地点反查失败');
    const data = await resp.json();
    const address = data.address || {};
    const candidates = [address.city, address.town, address.village, address.county, address.state, data.name, data.display_name];
    const match = candidates.find(isChinese);
    if (match) {
      const normalized = { ...place, name: match };
      placeCache.set(key, normalized);
      return normalized;
    }
  } catch (error) {}

  placeCache.set(key, place);
  return place;
}

async function normalizePlaces(places) {
  const normalized = await Promise.all(places.map(reverseChinesePlace));
  return dedupePlaces(normalized);
}

function renderSuggestions(items, emptyText = '没有找到匹配地点') {
  currentSuggestions = items;
  activeIndex = -1;
  if (!items.length) {
    suggestions.innerHTML = `
      <button class="suggestion" type="button" disabled>
        <span><strong>${escapeHTML(emptyText)}</strong><span>换一个更具体的名字试试</span></span>
      </button>`;
    suggestions.classList.add('show');
    return;
  }

  suggestions.innerHTML = items.map((place, index) => `
    <button class="suggestion" type="button" data-index="${index}" role="option">
      <span><strong>${escapeHTML(place.name)}</strong><span>${escapeHTML(place.admin1 || place.country || '中国')}</span></span>
      <small>${Number(place.latitude).toFixed(2)}, ${Number(place.longitude).toFixed(2)}</small>
    </button>
  `).join('');
  suggestions.classList.add('show');
}

function hideSuggestions() {
  suggestions.classList.remove('show');
  activeIndex = -1;
}

async function updateSuggestions(value) {
  const query = value.trim();
  clearBtn.classList.toggle('visible', query.length > 0);
  if (query.length < 2) {
    hideSuggestions();
    return;
  }

  const token = ++searchToken;
  try {
    const raw = await searchPlaces(query);
    if (token !== searchToken) return;
    renderSuggestions(await normalizePlaces(raw));
  } catch (error) {
    if (token === searchToken) renderSuggestions([], '搜索暂时不可用');
  }
}

async function fetchWeatherData(place) {
  const params = new URLSearchParams({
    latitude: place.latitude,
    longitude: place.longitude,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,cloud_cover,wind_speed_10m,weather_code,is_day',
    hourly: 'temperature_2m,weather_code,precipitation_probability,wind_speed_10m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset',
    timezone: 'auto',
    forecast_days: '7'
  });
  return fetchJSONFrom(requestOrder(
    `/api/weather?${params}`,
    `https://api.open-meteo.com/v1/forecast?${params}`
  ), '天气接口失败');
}

async function fetchWikiImages(query) {
  const params = new URLSearchParams({
    action: 'query',
    generator: 'search',
    gsrsearch: query,
    gsrlimit: '12',
    gsrnamespace: '0',
    gsrqiprofile: 'popular_inclinks_pv',
    gsrsort: 'relevance',
    prop: 'pageimages',
    piprop: 'thumbnail',
    pithumbsize: '2200',
    format: 'json',
    origin: '*'
  });
  const resp = await fetch(`https://zh.wikipedia.org/w/api.php?${params}`);
  if (!resp.ok) throw new Error('维基百科图片失败');
  const data = await resp.json();
  const pages = Object.values(data?.query?.pages || {});
  return pages
    .filter((item) => item.thumbnail && !item.missing)
    .map((item) => item.thumbnail.source);
}

async function fetchCommonsImages(query) {
  const params = new URLSearchParams({
    action: 'query',
    generator: 'search',
    gsrsearch: query,
    gsrlimit: '14',
    gsrnamespace: '6',
    gsrqiprofile: 'popular_inclinks_pv',
    gsrsort: 'relevance',
    prop: 'imageinfo',
    iiprop: 'url',
    iiurlwidth: '2200',
    format: 'json',
    origin: '*'
  });
  const resp = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`);
  if (!resp.ok) throw new Error('Commons 图片失败');
  const data = await resp.json();
  const pages = Object.values(data?.query?.pages || {});
  return pages
    .map((item) => item.imageinfo?.[0]?.thumburl || item.imageinfo?.[0]?.url)
    .filter(Boolean);
}

function imageQueriesFor(place) {
  const profile = profileFor(place);
  const cleanName = cleanCityName(place.name);
  const adminName = cleanCityName(place.admin1 || '');
  const priorityQueries = (profile.photoQueries || []).flatMap((query) => [
    query,
    `${query} 代表风景`,
    `${query} Wikimedia Commons`
  ]);
  const landmarkQueries = profile.landmarks.flatMap((landmark) => [
    landmark === cleanName ? `${cleanName} 地标` : `${cleanName} ${landmark}`,
    landmark === cleanName ? `${cleanName} 代表建筑` : `${cleanName} ${landmark} 地标`,
    landmark === cleanName ? `${cleanName} 夜景 地标` : `${cleanName} ${landmark} 夜景`,
    `${landmark} ${adminName}`
  ]);
  const fallbackQueries = [
    `${cleanName} 最著名地标`,
    `${cleanName} 老城 地标`,
    `${cleanName} 江河湖海 地标`,
    `${cleanName} 山水 名胜`,
    `${cleanName} landmark Wikimedia Commons`,
    `${cleanName} cityscape landmark`
  ];
  return uniqueItems([...priorityQueries, ...landmarkQueries, ...fallbackQueries]);
}

function makeTips(data, place) {
  const current = data.current || {};
  const daily = data.daily || {};
  const hourly = data.hourly || {};
  const profile = place ? profileFor(place) : null;
  const travel = profile?.travel || regionalTravelFor(place || {});
  const asNumber = (value, fallback = 0) => {
    const next = Number(value);
    return Number.isFinite(next) ? next : fallback;
  };
  const round = (value, fallback = 0) => Math.round(asNumber(value, fallback));
  const maxValue = (values, fallback = 0) => values.reduce((max, value) => Math.max(max, asNumber(value, fallback)), fallback);
  const includesCode = (codes, value) => codes.includes(Number(value));

  const code = Number(current.weather_code);
  const info = weatherInfo(code);
  const temp = round(current.temperature_2m);
  const apparent = round(current.apparent_temperature, temp);
  const precipitation = asNumber(current.precipitation);
  const todayRain = round(daily.precipitation_probability_max?.[0]);
  const tomorrowRain = round(daily.precipitation_probability_max?.[1]);
  const uv = round(daily.uv_index_max?.[0]);
  const wind = round(current.wind_speed_10m);
  const humidity = round(current.relative_humidity_2m);
  const cloud = round(current.cloud_cover);
  const todayHigh = round(daily.temperature_2m_max?.[0], temp);
  const todayLow = round(daily.temperature_2m_min?.[0], temp);
  const isDay = current.is_day !== 0;

  const hourlyTime = Array.isArray(hourly.time) ? hourly.time : [];
  const startIndex = hourlyTime.length
    ? Math.max(0, hourlyTime.findIndex((time) => new Date(time).getTime() >= Date.now() - 60 * 60 * 1000))
    : 0;
  const nextIndexes = hourlyTime.slice(startIndex, startIndex + 6).map((_, index) => startIndex + index);
  const nextRain = Math.max(todayRain, maxValue(nextIndexes.map((index) => hourly.precipitation_probability?.[index])));
  const nextWind = Math.max(wind, maxValue(nextIndexes.map((index) => hourly.wind_speed_10m?.[index])));
  const nextCodes = nextIndexes.map((index) => Number(hourly.weather_code?.[index])).filter(Number.isFinite);

  const thunderCodes = [95, 96, 99];
  const snowCodes = [71, 73, 75, 77, 85, 86];
  const freezingCodes = [56, 57, 66, 67];
  const fogCodes = [45, 48];
  const rainCodes = [61, 63, 65, 80, 81, 82];
  const drizzleCodes = [51, 53, 55];
  const cloudyCodes = [2, 3];
  const hasNext = (codes) => nextCodes.some((nextCode) => includesCode(codes, nextCode));
  const rainyNow = precipitation > 0 || includesCode(rainCodes, code);
  const drizzleNow = includesCode(drizzleCodes, code);
  const localLandmark = profile?.landmarks?.[0] || place?.name || '当地路线';

  const tips = [];
  const used = new Set();
  let localTipIndex = -1;
  const addTip = (score, icon, title, body, key = title) => {
    if (used.has(key)) return;
    used.add(key);
    tips.push({ score, icon, title, body });
  };
  const addLocalTip = (score, icon, key, fallbackTitle = '本地路线建议') => {
    const body = travel[key] || travel.default || `${localLandmark}一带最能体现当地特色，按当前天气缩短户外暴露时间，并给室内停靠点留余量。`;
    const next = { score, icon, title: `${localLandmark} · ${fallbackTitle}`, body };
    if (localTipIndex >= 0) {
      if (score >= tips[localTipIndex].score) tips[localTipIndex] = next;
      return;
    }
    localTipIndex = tips.length;
    used.add('local');
    tips.push(next);
  };

  if (includesCode(thunderCodes, code) || hasNext(thunderCodes)) {
    addTip(100, '⛈️', `雷暴提醒 · ${info.label}`, '先取消开阔地、高处和水边行程，优先选商场、博物馆、地铁沿线等室内路线。', 'storm');
    addLocalTip(94, '📍', 'rain', '本地避雨路线');
  } else if (includesCode(freezingCodes, code)) {
    addTip(98, '🧊', `冻雨提醒 · 体感${apparent}°C`, '路面、台阶和桥面可能很滑，步行放慢，骑行和电动车路线建议直接降级。', 'iceRain');
    addLocalTip(93, '📍', 'cold', '本地慢行建议');
  } else if (includesCode(snowCodes, code) || hasNext(snowCodes)) {
    addTip(96, '❄️', `雪天提醒 · ${info.label}`, '鞋底防滑比路线更重要，桥面、台阶和阴影处留余量，景点之间别排太满。', 'snow');
    addLocalTip(92, '📍', 'cold', '本地雪天路线');
  } else if (includesCode(fogCodes, code)) {
    addTip(92, '🌫️', `低能见度 · 云量${cloud}%`, '过街、上桥和骑行都要多留反应距离；观景台可以后移，街巷近景更适合。', 'fog');
    addLocalTip(88, '📍', 'clear', '近景路线建议');
  } else if (rainyNow) {
    addTip(90, '🌧️', `正在降水 · ${nextRain}%概率`, '伞和防水鞋放第一优先级，路线尽量串联地铁口、骑楼、商场和可避雨街区。', 'rain');
    addLocalTip(88, '📍', 'rain', '本地避雨路线');
  } else if (nextRain >= 65 || hasNext(rainCodes)) {
    addTip(86, '🌦️', `雨在路上 · 未来6小时${nextRain}%`, '先走户外段，把室内餐厅、展馆或商场放到后半程，避免被阵雨截在半路。', 'rain');
    addLocalTip(84, '📍', 'rain', '先户外后室内');
  } else if (drizzleNow || nextRain >= 35 || Math.max(todayRain, tomorrowRain) >= 45) {
    addTip(78, '☔', `可能飘雨 · 最高${Math.max(todayRain, nextRain)}%`, '带一把轻便伞，安排可进可退的路线；雨后天空和地面反光会更好看。', 'drizzle');
    addLocalTip(76, '📍', 'rain', '轻雨路线建议');
  } else if (code === 0 && cloud < 35) {
    addTip(56, '☀️', `晴朗适合远眺 · 云量${cloud}%`, '观景台、江边、湖边和城市轴线可以放进日程，拍远景会更干净。', 'clear');
    addLocalTip(74, '📍', 'clear', '经典视角');
  } else if (includesCode(cloudyCodes, code) || cloud >= 70) {
    addTip(52, '☁️', `云层较厚 · 云量${cloud}%`, '光线柔和，适合街巷、园林、建筑细节和长时间步行，正午也不容易刺眼。', 'cloud');
    addLocalTip(70, '📍', 'clear', '街巷近景');
  } else {
    addTip(48, info.icon, `${info.label}出行`, '天气变化不算激烈，路线可以按兴趣展开，给临时停留和拍照留一点空档。', 'mildWeather');
    addLocalTip(68, '📍', 'clear', '本地经典路线');
  }

  if (apparent >= 38) {
    addTip(88, '🥵', `体感过热 · ${apparent}°C`, '正午户外压缩到短距离，补水、防晒和空调休息点要提前安排好。', 'temperature');
    addLocalTip(87, '📍', 'heat', '高温路线调整');
  } else if (temp >= 32 || apparent >= 35) {
    addTip(82, '🧊', `高温提醒 · ${temp}°C`, '户外放在早晚，午后改成室内或树荫路线，随身带水比多走一个点更重要。', 'temperature');
    addLocalTip(81, '📍', 'heat', '高温路线调整');
  } else if (temp >= 28 && humidity >= 75) {
    addTip(76, '💧', `湿热明显 · 湿度${humidity}%`, '减少暴晒长线，选有空调、树荫或水边风口的中途停靠点。', 'temperature');
  } else if (apparent <= 0 || temp <= 3) {
    addTip(84, '🧣', `低温防风 · 体感${apparent}°C`, '风口、江边和高架处会更冷，手套、围巾和暖鞋比厚外套更关键。', 'temperature');
  } else if (temp <= 10 || todayLow <= 8) {
    addTip(70, '🧥', `早晚偏冷 · 最低${todayLow}°C`, '白天可以轻装一点，但傍晚后外套要跟上，夜景路线别排太晚。', 'temperature');
  } else if (todayHigh - todayLow >= 10) {
    addTip(62, '🧢', `温差较大 · ${todayLow}°/${todayHigh}°`, '采用薄外套叠穿，上午和傍晚多一层，午后可以轻装走。', 'temperature');
  } else {
    addTip(42, '🚶', `体感舒适 · ${apparent}°C`, '适合把步行段拉长一点，留一段给慢走、随手拍和临时绕路。', 'temperature');
  }

  if (nextWind >= 38) {
    addTip(86, '🌬️', `强风提醒 · ${Math.round(nextWind)} km/h`, '海边、江边、高处和长桥路线先降级，帽子、伞和轻便物品收进包里。', 'wind');
    addLocalTip(85, '📍', 'wind', '强风路线调整');
  } else if (nextWind >= 24) {
    addTip(66, '🍃', `风感明显 · ${Math.round(nextWind)} km/h`, '骑行、长桥和开阔广场会更费力，拍照时注意衣物和头发被风影响。', 'wind');
    addLocalTip(77, '📍', 'wind', '风天路线建议');
  }

  if (!rainyNow && nextRain >= 50) {
    addTip(74, '⏱️', `先户外后室内 · ${nextRain}%雨`, '把户外打卡点提前，餐饮、购物或展馆放在降水概率更高的时段。', 'rainTiming');
  }

  if (isDay && uv >= 8) {
    addTip(72, '🧴', `紫外线强 · 指数${uv}`, '防晒、帽子和墨镜都值得带，水面、浅色地面和玻璃幕墙会加倍反光。', 'uv');
  } else if (isDay && uv >= 5 && code === 0) {
    addTip(55, '🕶️', `日照明显 · 指数${uv}`, '长时间户外记得补防晒，观景和拍照更适合避开正午顶光。', 'uv');
  } else if (!isDay) {
    addTip(60, '🌙', `夜间出行 · 体感${apparent}°C`, '温度会继续下探，夜景路线注意末班交通，返程别只看距离。', 'night');
    addLocalTip(80, '📍', 'night', '夜间路线建议');
  } else if (humidity >= 85 && temp >= 22) {
    addTip(54, '🫧', `空气潮湿 · 湿度${humidity}%`, '衣物选轻薄速干，长时间步行会更闷，包里留纸巾或小毛巾。', 'humidity');
  }

  return tips
    .sort((a, b) => b.score - a.score)
    .slice(0, 3)
    .map(({ icon, title, body }) => ({ icon, title, body }));
}

function renderWeather(data, place, imageUrl) {
  const current = data.current;
  const daily = data.daily;
  const profile = profileFor(place);
  const info = weatherInfo(current.weather_code);
  const today = formatToday();
  const temp = Math.round(current.temperature_2m);
  const apparent = Math.round(current.apparent_temperature);
  const rain = Math.round(daily.precipitation_probability_max?.[0] || 0);
  const uv = Math.round(daily.uv_index_max?.[0] || 0);
  const wind = Math.round(current.wind_speed_10m || 0);
  const humidity = Math.round(current.relative_humidity_2m || 0);
  const cloud = Math.round(current.cloud_cover || 0);
  const sunrise = daily.sunrise?.[0] ? formatDate(daily.sunrise[0], { hour: '2-digit', minute: '2-digit' }) : '--';
  const sunset = daily.sunset?.[0] ? formatDate(daily.sunset[0], { hour: '2-digit', minute: '2-digit' }) : '--';
  const summary = `${place.name} 现在${info.label}，气温 ${temp}°C，体感 ${apparent}°C。湿度 ${humidity}%、风速 ${wind} km/h，今天最高降水概率约 ${rain}%。`;

  document.title = `${place.name} · Krick's Weather`;
  placeTitle.textContent = place.name;
  placeWeather.textContent = `${info.label} · ${temp}°C`;
  placeCopy.textContent = profile.copy;

  weatherPanel.innerHTML = `
    <div class="panel-head">
      <div>
        <h3 class="panel-title">当前天气</h3>
        <div class="location-name">${escapeHTML(place.name)}</div>
        <div class="location-meta">${escapeHTML(formatLabel(place))} · ${escapeHTML(today)}</div>
      </div>
      <div class="weather-badge">${escapeHTML(info.label)}</div>
    </div>

    <div class="temperature-row">
      <div class="weather-icon" aria-hidden="true">${info.icon}</div>
      <div>
        <div class="temperature"><strong>${temp}</strong><sup>°C</sup></div>
        <p class="weather-summary">${escapeHTML(summary)}</p>
        <button class="forecast-link" type="button" data-scroll-target="forecastPanel">Next 7 Days <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <h4 class="metric-title">实时数据</h4>
    <div class="metric-grid">
      <div class="metric"><span>体感温度</span><strong>${apparent}°C</strong></div>
      <div class="metric"><span>空气湿度</span><strong>${humidity}%</strong></div>
      <div class="metric"><span>风速</span><strong>${wind} km/h</strong></div>
      <div class="metric"><span>云量</span><strong>${cloud}%</strong></div>
      <div class="metric"><span>降水概率</span><strong>${rain}%</strong></div>
      <div class="metric"><span>紫外线</span><strong>${uv}</strong></div>
      <div class="metric"><span>日出</span><strong>${escapeHTML(sunrise)}</strong></div>
      <div class="metric"><span>日落</span><strong>${escapeHTML(sunset)}</strong></div>
    </div>`;

  renderForecast(daily);
  renderHourly(data.hourly);
  renderTips(makeTips(data, place));
}

function renderForecast(daily) {
  forecastList.innerHTML = daily.time.map((date, index) => {
    const info = weatherInfo(daily.weather_code[index]);
    const day = index === 0 ? '今天' : formatDate(date, { weekday: 'short' });
    const high = Math.round(daily.temperature_2m_max[index]);
    const low = Math.round(daily.temperature_2m_min[index]);
    const rain = Math.round(daily.precipitation_probability_max[index] || 0);
    return `
      <div class="forecast-card">
        <span>${escapeHTML(day)}</span>
        <div class="forecast-icon" aria-hidden="true">${info.icon}</div>
        <strong>${high}° / ${low}°</strong>
        <small>${escapeHTML(info.label)} · ${rain}%雨</small>
      </div>`;
  }).join('');
}

function renderHourly(hourly) {
  if (!hourly?.time?.length) {
    hourRow.innerHTML = '';
    return;
  }

  const now = Date.now();
  const startIndex = Math.max(0, hourly.time.findIndex((time) => new Date(time).getTime() >= now - 60 * 60 * 1000));
  const items = hourly.time.slice(startIndex, startIndex + 8).map((time, offset) => {
    const index = startIndex + offset;
    const info = weatherInfo(hourly.weather_code[index]);
    const hour = offset === 0 ? '现在' : formatDate(time, { hour: '2-digit', minute: '2-digit' });
    const temp = Math.round(hourly.temperature_2m[index]);
    const rain = Math.round(hourly.precipitation_probability[index] || 0);
    return `
      <div class="hour-card">
        <span>${escapeHTML(hour)}</span>
        <div class="mini-weather-icon" aria-hidden="true">${info.icon}</div>
        <strong>${temp}°</strong>
        <span>${rain}%雨</span>
      </div>`;
  });
  hourRow.innerHTML = items.join('');
}

function renderTips(tips) {
  tipsList.innerHTML = tips.map((tip) => `
    <div class="tip">
      <div class="tip-icon" aria-hidden="true">${escapeHTML(tip.icon)}</div>
      <div>
        <span>${escapeHTML(tip.title)}</span>
        <strong>${escapeHTML(tip.body)}</strong>
      </div>
    </div>
  `).join('');
}

searchInput.addEventListener('input', () => {
  window.clearTimeout(debounceTimer);
  debounceTimer = window.setTimeout(() => updateSuggestions(searchInput.value), 240);
});

searchInput.addEventListener('keydown', (event) => {
  const items = [...suggestions.querySelectorAll('.suggestion[data-index]')];
  if (!items.length) {
    if (event.key === 'Escape') hideSuggestions();
    return;
  }

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
  } else if (event.key === 'Enter' && activeIndex >= 0) {
    event.preventDefault();
    selectPlace(currentSuggestions[activeIndex]);
    return;
  } else if (event.key === 'Escape') {
    hideSuggestions();
    return;
  } else {
    return;
  }

  items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
});

searchForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const query = searchInput.value.trim();
  if (!query) return;

  try {
    const places = await normalizePlaces(await searchPlaces(query));
    if (!places.length) {
      renderSuggestions([], '没有找到这个地方');
      return;
    }
    selectPlace(places[0]);
  } catch (error) {
    renderSuggestions([], '搜索暂时不可用');
  }
});

suggestions.addEventListener('click', (event) => {
  const item = event.target.closest('.suggestion[data-index]');
  if (!item) return;
  selectPlace(currentSuggestions[Number(item.dataset.index)]);
});

quickRow.addEventListener('click', async (event) => {
  const button = event.target.closest('.chip-btn');
  if (!button) return;
  const city = button.dataset.city;
  searchInput.value = city;
  clearBtn.classList.add('visible');
  try {
    const places = await normalizePlaces(await searchPlaces(city));
    if (places[0]) selectPlace(places[0]);
  } catch (error) {
    renderSuggestions([], '搜索暂时不可用');
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  hideSuggestions();
  searchInput.focus();
});

backBtn.addEventListener('click', showSearchView);

document.addEventListener('click', (event) => {
  const jump = event.target.closest('[data-scroll-target]');
  if (jump) {
    const target = $(jump.dataset.scrollTarget);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (!event.target.closest('.search-wrap')) hideSuggestions();
});

updateClock();
renderQuickCities();
startHolographicEarth();
setInterval(updateClock, 30000);
showSearchView();
</script>
